<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cámara AR</title>
  <link rel="stylesheet" href="./css/ar-view.css">
  <script type="module" src="./js/ar-view.js"></script>
</head>
<body>
  <template id="ar-template">
    <a-scene embedded xr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" renderer="alpha: true; antialias: true; precision: mediump" arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; patternRatio: 0.5; cameraParametersUrl: ./assets/camera_para.dat;" loading-screen="enabled: false">
      <a-entity light="type: ambient; intensity: 1.8"></a-entity><a-entity light="type: directional; intensity: 2" position="1 3 2"></a-entity>
      <a-marker type="pattern" url="./assets/patterns/pista-1.patt" data-marker="1" emitevents="true" smooth="true">
        <a-entity id="ar-key" position="0 .6 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"><a-torus color="#dfb769" radius=".2" radius-tubular=".055" position="0 .25 0"></a-torus><a-box color="#dfb769" width=".08" height=".45" depth=".08" position="0 -.08 0"></a-box><a-box color="#dfb769" width=".2" height=".07" depth=".08" position=".07 -.25 0"></a-box></a-entity>
        <a-entity id="ar-chest" visible="false" position="0 .2 0"><a-box color="#57422a" width=".85" height=".4" depth=".55"></a-box><a-box id="ar-lid" color="#bd934b" width=".9" height=".13" depth=".6" position="0 .25 0"></a-box><a-octahedron id="ar-treasure" visible="false" color="#ffd675" radius=".23" position="0 .8 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-octahedron></a-entity>
      </a-marker>
      <a-marker type="pattern" url="./assets/patterns/pista-2.patt" data-marker="2" emitevents="true" smooth="true"><a-cylinder color="#eee6d7" radius=".48" height=".08" position="0 .15 0"></a-cylinder><a-entity id="ar-clock-hand" position="0 .22 0"><a-box color="#b44834" width=".04" height=".035" depth=".4" position="0 0 -.18"></a-box></a-entity><a-sphere id="ar-clock-light" color="#d2a146" radius=".09" position="0 .35 0"></a-sphere></a-marker>
      <a-marker type="pattern" url="./assets/patterns/pista-3.patt" data-marker="3" emitevents="true" smooth="true"><a-box data-door="0" color="#ba8429" position="-.6 .4 0" width=".25" height=".8" depth=".12"></a-box><a-box data-door="1" color="#b34835" position="-.2 .4 0" width=".25" height=".8" depth=".12"></a-box><a-box data-door="2" color="#426c9a" position=".2 .4 0" width=".25" height=".8" depth=".12"></a-box><a-box data-door="3" color="#527b66" position=".6 .4 0" width=".25" height=".8" depth=".12"></a-box></a-marker>
      <a-marker type="pattern" url="./assets/patterns/pista-4.patt" data-marker="4" emitevents="true" smooth="true"><a-box color="#ede2cb" width=".8" height=".06" depth=".6" position="0 .15 0" rotation="0 12 0"></a-box><a-box color="#ede2cb" width=".8" height=".06" depth=".6" position="0 .24 0" rotation="0 -10 0"></a-box><a-box color="#b44834" width=".28" height=".07" depth=".16" position="0 .3 0"></a-box></a-marker>
      <a-marker type="pattern" url="./assets/patterns/pista-5.patt" data-marker="5" emitevents="true" smooth="true"><a-cylinder color="#bc9957" radius=".05" height=".7" position="0 .35 0"></a-cylinder><a-box id="ar-balance-beam" color="#bc9957" width="1.1" height=".06" depth=".08" position="0 .7 0"></a-box><a-cylinder color="#bc9957" radius=".23" height=".04" position="-.43 .4 0"></a-cylinder><a-cylinder color="#bc9957" radius=".23" height=".04" position=".43 .4 0"></a-cylinder></a-marker>
      <a-marker type="pattern" url="./assets/patterns/pista-6.patt" data-marker="6" emitevents="true" smooth="true"><a-entity id="ar-guardian"><a-octahedron color="#b44834" radius=".4" position="0 .65 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 7000"></a-octahedron><a-torus color="#bd934b" radius=".55" radius-tubular=".025" position="0 .65 0"></a-torus></a-entity><a-entity id="ar-room" visible="false"><a-box color="#a8a491" width="1.2" height=".06" depth="1" position="0 .02 0"></a-box><a-box color="#787e70" width=".08" height="1.2" depth=".1" position="-.5 .6 -.3"></a-box><a-box color="#787e70" width=".08" height="1.2" depth=".1" position=".5 .6 -.3"></a-box><a-box color="#787e70" width="1.08" height=".08" depth=".1" position="0 1.2 -.3"></a-box><a-box color="#b6b09d" width=".3" height=".3" depth=".3" position="0 .18 0"></a-box></a-entity></a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </template>
</body>
</html>
